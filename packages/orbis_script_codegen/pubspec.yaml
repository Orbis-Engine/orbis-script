name: orbis_script_codegen
description: >-
  Generates TypeScript typings from the component manifests an Orbis workspace
  publishes, so a script gets completion and type checking for an engine it
  never compiles against.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
