name: orbis_script
description: >-
  The Orbis scripting runtime. Runs TypeScript and JavaScript game logic on
  QuickJS, against the engine's own C ABI rather than through the Dart host.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  code_assets: ^1.2.1
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
