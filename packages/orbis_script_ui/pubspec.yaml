name: orbis_script_ui
description: >-
  A user interface described in TypeScript and built in Flutter: one widget
  vocabulary, styled with utility classes or CSS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # For the one test that runs the whole chain: script in the real engine,
  # through the description, out as widgets. Only a test needs it — this
  # package builds widgets from a description and does not care where the
  # description came from.
  orbis_script:
    path: ../orbis_script
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
